spring:
  datasource:
    url: jdbc:h2:mem:openex;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

openex:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret-1234
    ttl-minutes: 60
  markets:
    - BTC-USD
