services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - openex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 4s
      timeout: 4s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 2s
      retries: 10

  api:
    build: ./backend
    container_name: openex-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openex
      DB_USER: openex
      DB_PASSWORD: openex
      REDIS_HOST: redis
      JWT_SECRET: rebel-alliance-secret-rebel-alliance-secret-rebel-alliance-64b
    ports:
      - "8080:8080"
volumes:
  openex_pgdata:
