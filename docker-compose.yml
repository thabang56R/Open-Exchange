services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - openex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build: ./backend
    container_name: openex-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openex
      DB_USER: openex
      DB_PASSWORD: openex
      REDIS_HOST: redis
      JWT_SECRET: rebel-alliance-secret-rebel-alliance-secret-rebel-alliance-64b
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  analytics:
    build: ./analytics
    container_name: openex-analytics
    depends_on:
      api:
        condition: service_healthy
    environment:
      KOTLIN_API_URL: http://api:8080
      # host.docker.internal lets the container reach Ollama running on the host
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  openex_pgdata:
