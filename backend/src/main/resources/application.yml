spring:
  application:
    name: openex
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${DB_USER:openex}
    password: ${DB_PASSWORD:openex}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

openex:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-64-bytes-minimum-secret}
    ttl-minutes: 120
  markets:
    - BTC-USD
    - ETH-USD

server:
  port: ${PORT:8080}
